name: Compile Nuttx Targets

on:
  push:
    branches:
    - 'main'
    - 'stable'
    - 'beta'
    - 'release'
    - 'release/*'
    tags:
    - 'v*'
  pull_request:
    branches:
    - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    container: px4io/px4-dev-nuttx-focal:2022-08-12
    strategy:
      fail-fast: false
      matrix:
        config: [
          airmind_mindpx-v2,
          ark_can-flow,
          ark_can-gps,
          ark_can-rtk-gps,
          ark_cannode,
          ark_fmu-v6x,
          ark_fpv,
          ark_pi6x,
          ark_septentrio-gps,
          atl_mantis-edu,
          av_x-v1,
          bitcraze_crazyflie,
          bitcraze_crazyflie21,
          cuav_can-gps-v1,
          cuav_nora,
          cuav_x7pro,
          cubepilot_cubeorange,
          cubepilot_cubeorangeplus,
          cubepilot_cubeyellow,
          diatone_mamba-f405-mk2,
          flywoo_gn-f405,
          freefly_can-rtk-gps,
          hkust_nxt-dual,
          hkust_nxt-v1,
          holybro_can-gps-v1,
          holybro_durandal-v1,
          holybro_kakutef7,
          holybro_kakuteh7,
          holybro_kakuteh7mini,
          holybro_kakuteh7v2,
          holybro_pix32v5,
          matek_gnss-m9n-f4,
          matek_h743,
          matek_h743-mini,
          matek_h743-slim,
          modalai_fc-v1,
          modalai_fc-v2,
          mro_ctrl-zero-classic,
          mro_ctrl-zero-f7,
          mro_ctrl-zero-f7-oem,
          mro_ctrl-zero-h7,
          mro_ctrl-zero-h7-oem,
          mro_pixracerpro,
          mro_x21,
          mro_x21-777,
          nxp_fmuk66-e,
          nxp_fmuk66-v3,
          nxp_mr-canhubk3,
          nxp_ucans32k146,
          omnibus_f4sd,
          px4_fmu-v2,
          px4_fmu-v3,
          px4_fmu-v4,
          px4_fmu-v4pro,
          px4_fmu-v5,
          px4_fmu-v5x,
          px4_fmu-v6c,
          px4_fmu-v6u,
          px4_fmu-v6x,
          px4_fmu-v6xrt,
          raspberrypi_pico,
          siyi_n7,
          sky-drones_smartap-airlink,
          spracing_h7extreme,
          thepeach_k1,
          thepeach_r1,
          tuogao_flight_control_v1,
          uvify_core,
          zeroone_x6
          ]
    steps:
    - uses: actions/checkout@v4

    - name: Use ARM GCC 10.2.1
      shell: bash
      run: |
        set -euo pipefail

        rm -rf /opt/gcc
        mkdir -p /opt/gcc

        curl -fL \
          --retry 5 \
          --retry-delay 5 \
          --connect-timeout 30 \
          https://firmware.ardupilot.org/Tools/STM32-tools/gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2 \
          -o /tmp/gcc-arm-none-eabi.tar.bz2

        tar -xjf /tmp/gcc-arm-none-eabi.tar.bz2 \
          --strip-components=1 \
          -C /opt/gcc

        rm -f /tmp/gcc-arm-none-eabi.tar.bz2

        arm-none-eabi-gcc --version
        arm-none-eabi-g++ --version

    - name: Prepare ccache timestamp
      id: ccache_cache_timestamp
      shell: cmake -P {0}
      run: |
        string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
        message("::set-output name=timestamp::${current_date}")
    - name: ccache cache files
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{matrix.config}}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
        restore-keys: ${{matrix.config}}-ccache-
    - name: setup ccache
      run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 6" >> ~/.ccache/ccache.conf
          echo "max_size = 120M" >> ~/.ccache/ccache.conf
          echo "hash_dir = false" >> ~/.ccache/ccache.conf
          ccache -s
          ccache -z

    - name: make release targets for ${{matrix.config}}
      shell: bash
      run: |
        set -euo pipefail

        config="${{matrix.config}}"
        manufacturer="${config%%_*}"
        board="${config#*_}"

        targets=("${config}_default")

        if [[ -f "boards/${manufacturer}/${board}/bootloader.px4board" ]]; then
          targets+=("${config}_bootloader")
        fi

        if [[ -f "boards/${manufacturer}/${board}/canbootloader.px4board" ]]; then
          targets+=("${config}_canbootloader")
        fi

        echo "Building release targets:"
        printf '  %s\n' "${targets[@]}"

        for target in "${targets[@]}"; do
          echo "Building ${target}"
          make "${target}"
        done
      timeout-minutes: 45
    - name: make ${{matrix.config}} bloaty_compileunits
      run: make ${{matrix.config}} bloaty_compileunits || true
    - name: make ${{matrix.config}} bloaty_inlines
      run: make ${{matrix.config}} bloaty_inlines || true
    - name: make ${{matrix.config}} bloaty_segments
      run: make ${{matrix.config}} bloaty_segments || true
    - name: make ${{matrix.config}} bloaty_symbols
      run: make ${{matrix.config}} bloaty_symbols || true
    - name: make ${{matrix.config}} bloaty_templates
      run: make ${{matrix.config}} bloaty_templates || true
    - name: make ${{matrix.config}} bloaty_ram
      run: make ${{matrix.config}} bloaty_ram || true
    - name: make ${{matrix.config}} bloaty_compare_master
      run: make ${{matrix.config}} bloaty_compare_master || true
    - name: ccache post-run
      run: ccache -s

    - name: Prepare release artifact
      shell: bash
      run: |
        set -euo pipefail

        config="${{ matrix.config }}"
        manufacturer="${config%%_*}"
        board="${config#*_}"
        board_dir="boards/${manufacturer}/${board}"

        rm -rf release-staging
        mkdir -p release-staging

        default_build_dir="build/${config}_default"

        if [[ -f "${board_dir}/canbootloader.px4board" ]]; then
          mapfile -d '' uavcan_files < <(
            find "${default_build_dir}" -maxdepth 1 -type f \
              -name '*.uavcan.bin' -print0
          )

          if [[ "${#uavcan_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one UAVCAN firmware for ${config}, found ${#uavcan_files[@]}"
            printf '  %s\n' "${uavcan_files[@]}"
            exit 1
          fi

          cp "${uavcan_files[0]}" \
            "release-staging/${config}_default.uavcan.bin"

        else
          default_firmware="${default_build_dir}/${config}_default.px4"

          if [[ ! -f "${default_firmware}" ]]; then
            echo "Default PX4 firmware not found: ${default_firmware}"
            exit 1
          fi

          cp "${default_firmware}" release-staging/
        fi

        if [[ -f "${board_dir}/bootloader.px4board" ]]; then
          bootloader_firmware="build/${config}_bootloader/${config}_bootloader.bin"

          if [[ ! -f "${bootloader_firmware}" ]]; then
            echo "Bootloader firmware not found: ${bootloader_firmware}"
            exit 1
          fi

          cp "${bootloader_firmware}" release-staging/
        fi

        if [[ -f "${board_dir}/canbootloader.px4board" ]]; then
          canbootloader_firmware="build/${config}_canbootloader/${config}_canbootloader.bin"

          if [[ ! -f "${canbootloader_firmware}" ]]; then
            echo "CAN bootloader firmware not found: ${canbootloader_firmware}"
            exit 1
          fi

          cp "${canbootloader_firmware}" release-staging/
        fi

        echo "Release files for ${config}:"
        find release-staging -maxdepth 1 -type f -printf '  %f\n'

    - name: Upload px4 package
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: px4_package_${{ matrix.config }}
        path: release-staging/*
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download firmware
      uses: actions/download-artifact@v4
      with:
        pattern: px4_package_*
        path: artifacts

    - name: Prepare release files
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release-assets

        mapfile -d '' files < <(
          find artifacts -type f \( -name '*.px4' -o -name '*.bin' \) -print0
        )
        test "${#files[@]}" -gt 0

        for file in "${files[@]}"; do
          output="release-assets/${file##*/}"
          test ! -e "$output"
          cp "$file" "$output"
        done

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release create "$GITHUB_REF_NAME" release-assets/* \
          --verify-tag \
          --title "$GITHUB_REF_NAME" \
          --generate-notes
